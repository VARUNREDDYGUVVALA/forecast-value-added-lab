services:
  forecast:
    build: .
    environment:
      FVA_STREAM_TOKEN: ${FVA_STREAM_TOKEN:-}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
