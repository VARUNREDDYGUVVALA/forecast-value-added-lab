name: Validation and Pages
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m backend.engine --export /tmp/forecast-demo.json && diff -u src/demo.json /tmp/forecast-demo.json
      - run: python -m backend.online_demo --export /tmp/forecast-online.json && diff -u src/online-demo.json /tmp/forecast-online.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify public demo
        env:
          DEMO_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'JS'
          const url = new URL(process.env.DEMO_URL)
          let failure
          for (let attempt = 0; attempt < 8; attempt++) {
            try {
              const response = await fetch(url, { cache: 'no-store', signal: AbortSignal.timeout(10000) })
              if (!response.ok) throw new Error(`Site returned HTTP ${response.status}`)
              const html = await response.text()
              const entry = html.match(/<script\b[^>]*\bsrc="([^"]+\.js)"/)?.[1]
              if (!entry || !html.includes('Forecast Value Added Scorecard')) throw new Error('Dashboard entry point missing')
              const asset = await fetch(new URL(entry, url), { signal: AbortSignal.timeout(10000) })
              const bundle = await asset.text()
              if (!asset.ok || !bundle.includes('Live demand lab') || !bundle.includes('Online forecasting') || !bundle.includes('Demand planner') || !bundle.includes('Latest per item') || !bundle.includes('Simulated planning adjustment')) {
                throw new Error('Forecasting bundle unavailable')
              }
              console.log(`Verified the dashboard and live lab bundle at ${url}`)
              process.exit(0)
            } catch (error) {
              failure = error
              if (attempt < 7) await new Promise(resolve => setTimeout(resolve, 5000))
            }
          }
          throw failure
          JS
